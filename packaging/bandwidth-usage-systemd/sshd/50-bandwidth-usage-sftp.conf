# Restricted SFTP receiver for Bandwidth Usage Modeling & Reporting uploads.
# Public-key provisioning remains an administrator deployment step; do not put
# keys in this packaged configuration file.

Match User bandwidth-usage-upload
    ChrootDirectory /var/sftp
    ForceCommand internal-sftp -d /
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no
